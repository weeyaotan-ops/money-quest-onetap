name: Session Breakout Live Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hunter-core-v1-live.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: session-breakout-live
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout session breakout monitor
        uses: actions/checkout@v4
        with:
          ref: hunter-core-v1-clean

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore signal state
        uses: actions/cache@v4
        with:
          path: .hunter_state
          key: session-breakout-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            session-breakout-state-

      - name: Deterministic safety tests
        run: |
          node --check hunter_core_v1/session_breakout_monitor.js
          node test/hunter_session_breakout.test.js
          node test/hunter_market_data.test.js

      - name: Scan closed M15 candle and notify
        env:
          HUNTER_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT
          HUNTER_SESSIONS: LONDON,NEW_YORK
          HUNTER_TP_R: "2"
          HUNTER_EQUITY_USDT: "1000"
          HUNTER_RISK_PCT: "0.005"
          HUNTER_MAX_SIGNAL_AGE_MS: "1200000"
          HUNTER_STATE_PATH: ".hunter_state/session_breakout_state.json"
          HUNTER_ONESHOT: "1"
          TELEGRAM_STARTUP_NOTICE: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node hunter_core_v1/session_breakout_monitor.js

      - name: Archive monitor state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-breakout-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hunter_state/session_breakout_state.json
          if-no-files-found: ignore
          retention-days: 30
