# One-shot cleanup for old Telegram pollers
name: Hunter Adaptive Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hunter-interactive-bot.yml"

concurrency:
  group: hunter-interactive-telegram-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Old Telegram pollers cancelled"
