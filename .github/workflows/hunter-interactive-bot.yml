# UI refresh: visible V2 intelligence button 2026-10-03
# Telegram + market scanner run in one process; self-rotates before GitHub timeout.
# Runtime source refresh: SOL scanner enabled 2026-10-03
# Fast lifecycle refresh: TP/SL/expiry monitor ~2s 2026-10-05
# Execution overlay: 250U fallback, fee-aware sizing, max 5x 2026-10-05
# Capital presets: Telegram 200/250/300U persisted setting 2026-10-05
# Hotfix restart: missing live quote no longer treated as zero 2026-10-05
# Entry confirmation + live entry guard + strict cost filter 2026-10-05
# Redeploy after entry-confirmation test alignment 2026-10-05
