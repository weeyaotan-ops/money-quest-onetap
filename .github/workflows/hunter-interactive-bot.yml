# Hunter Adaptive V1 Telegram command center
# Minimal live UI: now, active, records, results, learn, health, system.
name: Hunter Adaptive Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hunter-interactive-bot.yml"
  workflow_dispatch:
  schedule:
    - cron: "5,20,35,50 * * * *"

concurrency:
  group: hunter-interactive-telegram-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Hunter Core V1
        uses: actions/checkout@v4
        with:
          ref: hunter-core-v1-clean

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore latest Hunter Adaptive state
        uses: actions/cache/restore@v4
        with:
          path: .hunter_state
          key: hunter-adaptive-reader-${{ github.run_id }}
          restore-keys: |
            hunter-adaptive-state-

      - name: Validate adaptive bot
        run: node --check hunter_core_v1/adaptive_bot.js

      - name: Run adaptive bot
        env:
          HUNTER_ADAPTIVE_STATE_PATH: ".hunter_state/hunter_adaptive_state.json"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node hunter_core_v1/adaptive_bot.js
