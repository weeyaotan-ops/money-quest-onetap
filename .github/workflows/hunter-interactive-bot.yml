name: Hunter Interactive Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hunter-interactive-bot.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: hunter-interactive-telegram-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Hunter Core V1
        uses: actions/checkout@v4
        with:
          ref: hunter-core-v1-clean

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore latest Hunter journal
        uses: actions/cache/restore@v4
        with:
          path: .hunter_state
          key: hunter-interactive-${{ github.run_id }}
          restore-keys: |
            hunter-state-

      - name: Syntax check
        run: |
          node --check hunter_core_v1/interactive_bot.js
          node test/hunter_journal.test.js

      - name: Run interactive bot
        env:
          HUNTER_STATE_PATH: ".hunter_state/state.json"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node hunter_core_v1/interactive_bot.js
