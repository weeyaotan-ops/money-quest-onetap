# Hunter v6: TP SL lab + production shadow compatibility
# Reads the latest session-breakout cache so SIGNAL RECORDS stays current.
name: Hunter Interactive Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hunter-interactive-bot.yml"
  workflow_dispatch:
  schedule:
    - cron: "5,20,35,50 * * * *"

concurrency:
  group: hunter-interactive-telegram-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Hunter Core V1
        uses: actions/checkout@v4
        with:
          ref: hunter-core-v1-clean

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore latest Hunter journal
        uses: actions/cache/restore@v4
        with:
          path: .hunter_state
          key: hunter-interactive-${{ github.run_id }}
          restore-keys: |
            hunter-state-

      - name: Restore latest breakout results
        uses: actions/cache/restore@v4
        with:
          path: .hunter_state
          key: breakout-reader-${{ github.run_id }}
          restore-keys: |
            session-breakout-state-

      - name: Install public market data helper
        run: npm install --no-save dukascopy-node

      - name: Syntax and analyst tests
        run: |
          node --check hunter_core_v1/interactive_bot.js
          node --check hunter_core_v1/session_breakout_check.js
          node --check hunter_core_v1/journal.js
          node --check hunter_core_v1/advisor.js
          node test/hunter_journal.test.js
          node test/hunter_advisor.test.js
          node test/hunter_market_data.test.js

      - name: Run interactive bot
        env:
          HUNTER_STATE_PATH: ".hunter_state/state.json"
          BREAKOUT_STATE_PATH: ".hunter_state/session_breakout_state.json"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BREAKOUT_CRYPTO_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,LTCUSDT,DOTUSDT,SUIUSDT
          FX_SYMBOLS: XAUUSD,EURUSD,GBPUSD,USDJPY,AUDUSD,USDCHF,USDCAD,NZDUSD
        run: node hunter_core_v1/interactive_bot.js
