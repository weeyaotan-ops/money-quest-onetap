name: Hunter V3 Robust Edge Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hunter-v3-research.yml"

concurrency:
  group: hunter-v3-robust-edge-research
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: hunter-core-v1-clean

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile research/backtest_hunter_v1.py
          python -m py_compile research/backtest_hunter_v3.py

      - name: Run V3 robust edge research
        run: |
          python research/backtest_hunter_v3.py             --workers 28             --out v3_output

      - name: Upload V3 research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-v3-research-${{ github.run_id }}
          path: v3_output/
          if-no-files-found: warn
          retention-days: 90
