name: MemeHunter CI

on:
  push:
    branches: [solana-memehunter-v1]
    paths:
      - 'memehunter/**'
      - '.github/workflows/memehunter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memehunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: memehunter/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
