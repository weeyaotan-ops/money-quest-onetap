# Hunter Adaptive V1 live scanner
# Trend retest + range sweep/reclaim; signal only.
name: Hunter Adaptive Live Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/session-breakout-live.yml"
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: read

concurrency:
  group: hunter-adaptive-live
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Hunter Adaptive V1
        uses: actions/checkout@v4
        with:
          ref: hunter-adaptive-v1-live

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore adaptive state
        uses: actions/cache@v4
        with:
          path: .hunter_state
          key: hunter-adaptive-v1-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hunter-adaptive-v1-state-

      - name: Install market data helper
        run: npm install --no-save dukascopy-node

      - name: Validate engine
        run: |
          node --check adaptive_hunter_monitor.js
          node test/adaptive_hunter_monitor.test.js

      - name: Scan latest closed M15 candle
        env:
          ADAPTIVE_STATE_PATH: ".hunter_state/adaptive_state.json"
          ADAPTIVE_RISK_PCT: "0.005"
          ADAPTIVE_DAILY_STOP_R: "-2"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node adaptive_hunter_monitor.js
