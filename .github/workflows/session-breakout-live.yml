# Hunter Adaptive V1 live scanner
# Trend retest + range sweep/reclaim; signal only.
name: Hunter Adaptive Live Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/session-breakout-live.yml"
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: read

concurrency:
  group: session-breakout-live
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout signal engine
        uses: actions/checkout@v4
        with:
          ref: exact-mirror-resting-v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore breakout state
        uses: actions/cache@v4
        with:
          path: .hunter_state
          key: hunter-adaptive-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hunter-adaptive-state-

      - name: Install public market data helper
        run: npm install --no-save dukascopy-node

      - name: Validate Hunter Adaptive
        run: |
          node --check hunter_adaptive_engine.js
          node test/hunter_adaptive_engine.test.js

      - name: Scan latest closed M15 candle
        env:
          HUNTER_RUN_ONCE: "true"
          HUNTER_ADAPTIVE_STATE_PATH: ".hunter_state/hunter_adaptive_state.json"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node hunter_adaptive_engine.js
