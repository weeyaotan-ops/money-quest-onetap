name: Session Shadow Lab CI

on:
  pull_request:
    paths:
      - 'hunter_core_v1/session_breakout_monitor.js'
      - 'hunter_core_v1/session_breakout_shadow.js'
      - 'hunter_core_v1/session_breakout_check.js'
      - 'hunter_core_v1/interactive_bot.js'
      - 'test/hunter_session_breakout.test.js'
      - '.github/workflows/session-shadow-lab-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check hunter_core_v1/session_breakout_monitor.js
      - run: node --check hunter_core_v1/session_breakout_shadow.js
      - run: node --check hunter_core_v1/session_breakout_check.js
      - run: node --check hunter_core_v1/interactive_bot.js
      - run: node test/hunter_session_breakout.test.js
